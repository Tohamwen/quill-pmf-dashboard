<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quill Meetings — PMF Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e4e7;
    --muted: #9ca3af;
    --accent: #6366f1;
    --accent2: #22d3ee;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f59e0b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    min-height: 100vh;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .header h1 span { color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 20px; }
  .header .meta { color: var(--muted); font-size: 13px; text-align: right; }
  .header .meta .live {
    display: inline-block; width: 8px; height: 8px;
    background: var(--green); border-radius: 50%; margin-right: 4px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Toggle */
  .view-toggle {
    display: flex; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; flex-shrink: 0;
  }
  .view-toggle button {
    padding: 8px 18px; font-size: 13px; font-weight: 600; border: none;
    background: transparent; color: var(--muted); cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .view-toggle button.active { background: var(--accent); color: #fff; }
  .view-toggle button:hover:not(.active) { background: #252838; color: var(--text); }

  /* KPI Cards */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px; margin-bottom: 28px;
  }
  .kpi-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; transition: transform 0.15s;
  }
  .kpi-card:hover { transform: translateY(-2px); }
  .kpi-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 8px; }
  .kpi-value { font-size: 28px; font-weight: 700; letter-spacing: -1px; }
  .kpi-sub { font-size: 12px; margin-top: 6px; }
  .kpi-sub.up { color: var(--green); }
  .kpi-sub.down { color: var(--red); }
  .kpi-sub.neutral { color: var(--muted); }

  /* Progress bar */
  .progress-wrap { margin-top: 10px; }
  .progress-bar-bg {
    width: 100%; height: 6px; background: #1e2130; border-radius: 3px; overflow: hidden;
  }
  .progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
  .progress-label { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; }

  /* Chart sections */
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .chart-subtitle { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .chart-container { position: relative; height: 280px; }

  /* Comparison cards for daily view */
  .comparison-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .comparison-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .comparison-header { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 12px; }
  .comparison-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
  .comparison-row + .comparison-row { border-top: 1px solid #1e2130; }
  .comparison-current { font-size: 22px; font-weight: 700; }
  .comparison-prev { font-size: 14px; color: var(--muted); }
  .comparison-delta { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
  .comparison-delta.up { background: rgba(34,197,94,0.12); color: var(--green); }
  .comparison-delta.down { background: rgba(239,68,68,0.12); color: var(--red); }
  .comparison-delta.na { background: rgba(156,163,175,0.1); color: var(--muted); }

  /* Funnel */
  .funnel-bar-container { display: flex; align-items: center; margin-bottom: 10px; }
  .funnel-label { width: 160px; font-size: 13px; color: var(--muted); text-align: right; padding-right: 16px; flex-shrink: 0; }
  .funnel-bar-bg { flex: 1; background: #1e2130; border-radius: 6px; height: 32px; position: relative; overflow: hidden; }
  .funnel-bar-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 12px; font-size: 13px; font-weight: 600; transition: width 1s ease; }
  .funnel-rate { width: 80px; text-align: right; font-size: 12px; color: var(--muted); padding-left: 12px; flex-shrink: 0; }

  /* Table */
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .data-table td { padding: 10px 12px; border-bottom: 1px solid #1e2130; }
  .data-table tr:hover td { background: #1e2130; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge.core { background: rgba(99,102,241,0.15); color: #818cf8; }
  .badge.legacy { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .badge.partial { background: rgba(245,158,11,0.15); color: #fbbf24; }

  /* Loading */
  .loading { text-align: center; padding: 60px; color: var(--muted); font-size: 14px; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) { .charts-grid, .comparison-grid { grid-template-columns: 1fr; } .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { body { padding: 12px; } .kpi-grid { grid-template-columns: 1fr; } .header { flex-direction: column; gap: 12px; align-items: flex-start; } .header-right { width: 100%; justify-content: space-between; } }
</style>
</head>

let currentView = 'daily';
let chartInstances = {};

const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function fmt(n) { return n == null ? '—' : Number(n).toLocaleString('en-US'); }
function fmtMoneyFull(n) { return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtMoney(n) { return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0}); }

function getToday() {
  // Today is Monday, March 16, 2026
  return "2026-03-16";
}

function getDayOfWeek(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return DAYS[d.getDay()];
}

function findDailyData(dateStr) {
  return DAILY_DATA.find(d => d.date === dateStr) || null;
}

function findSameDayLastWeek(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() - 7);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const prevDate = `${y}-${m}-${day}`;
  return findDailyData(prevDate);
}

function destroyCharts() {
  Object.values(chartInstances).forEach(c => c.destroy());

}

function setView(view) {
  currentView = view;
  document.getElementById('btnDaily').classList.toggle('active', view === 'daily');
  document.getElementById('btnWeekly').classList.toggle('active', view === 'weekly');
  render();
}

function deltaHtml(current, previous, suffix) {
  if (current == null || previous == null) return '<span class="comparison-delta na">N/A</span>';
  const diff = current - previous;
  const pct = previous > 0 ? ((diff / previous) * 100).toFixed(1) : '—';
  const cls = diff >= 0 ? 'up' : 'down';
  const arrow = diff >= 0 ? '&#9650;' : '&#9660;';
  return `<span class="comparison-delta ${cls}">${arrow} ${Math.abs(diff)} (${diff >= 0 ? '+' : ''}${pct}%)${suffix || ''}</span>`;
}

function progressBar(current, target, color) {
  if (current == null || target == null || target === 0) return '';
  const pct = Math.min((current / target) * 100, 100).toFixed(1);
  return `
    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width:${pct}%;background:${color}"></div>
      </div>
      <div class="progress-label">
        <span>${fmt(current)} so far</span>
        <span>${pct}% of last week (${fmt(target)})</span>
      </div>
    </div>`;
}

function renderDaily() {
  const today = getToday();
  const todayData = findDailyData(today);
  const lastWeekData = findSameDayLastWeek(today);
  const dayName = getDayOfWeek(today);
  const lastWeekDay = lastWeekData ? lastWeekData.date : null;

  const partialTag = todayData && todayData.partial ? ' <span class="badge partial">Partial</span>' : '';

  const formatDate = (d) => {
    if (!d) return '';
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  };

  const todayLabel = `${dayName}, ${formatDate(today)}`;
  const lastWeekLabel = lastWeekData ? `${dayName}, ${formatDate(lastWeekDay)}` : 'Last week';

  // Build comparison cards
  const metrics = [
    {
      label: 'Meeting Users (15min+)',
      current: todayData ? todayData.meeting_dau : null,
      previous: lastWeekData ? lastWeekData.meeting_dau : null
    },
    {
      label: 'Quilliam Agent DAU',
      current: todayData ? todayData.quilliam : null,
      previous: lastWeekData ? lastWeekData.quilliam : null
    },
    {
      label: 'New Signups',
      current: todayData ? todayData.signups : null,
      previous: lastWeekData ? lastWeekData.signups : null
    },
    {
      label: 'Downloads',
      current: todayData ? todayData.downloads : null,
      previous: lastWeekData ? lastWeekData.downloads : null
    }
  ];

  let cardsHtml = `
    <div style="margin-bottom:20px">
      <h2 style="font-size:18px;font-weight:600;margin-bottom:4px">${todayLabel}${partialTag}</h2>
      <p style="font-size:13px;color:var(--muted)">Compared to ${lastWeekLabel}</p>
    </div>
    <div class="comparison-grid">`;

  metrics.forEach(m => {
    const hasData = m.current != null;
    const hasPrev = m.previous != null;
    cardsHtml += `
      <div class="comparison-card">
        <div class="comparison-header">${m.label}</div>
        <div style="display:flex;align-items:baseline;gap:16px;margin-bottom:8px">
          <div class="comparison-current">${hasData ? fmt(m.current) : '—'}</div>
          ${deltaHtml(m.current, m.previous)}
        </div>
        <div class="comparison-prev">Last ${dayName}: ${hasPrev ? fmt(m.previous) : 'N/A'}</div>
      </div>`;
  });

  cardsHtml += '</div>';

  // Daily trend chart (last 14 days for context)
  const last14 = DAILY_DATA.slice(-14);

  let chartsHtml = `
    <div class="charts-grid">
      <div class="chart-card full">
        <div class="chart-title">Quilliam Agent — Daily Active Users</div>
        <div class="chart-subtitle">Last 14 days</div>
        <div class="chart-container"><canvas id="dailyQuilliamChart"></canvas></div>
      </div>
    </div>`;

  return cardsHtml + chartsHtml;
}

function renderWeekly() {

  const lastWeek = WEEKLY_DATA.find(w => w.complete && w.week_num === (currentWeek ? currentWeek.week_num - 1 : null));

  if (!currentWeek || !lastWeek) return '<p style="color:var(--muted)">Insufficient weekly data.</p>';

  const weekLabel = `Week ${currentWeek.week_num} (${new Date(currentWeek.week_start+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})} –)`;
  const daysSoFar = currentWeek.days_reported;
  const dayLabel = daysSoFar === 1 ? '1 day' : `${daysSoFar} days`;

  let html = `
    <div style="margin-bottom:20px">
      <h2 style="font-size:18px;font-weight:600;margin-bottom:4px">${weekLabel} <span class="badge partial">${dayLabel} in · Updated ${currentWeek.last_updated}</span></h2>
      <p style="font-size:13px;color:var(--muted)">Tracking toward complete week vs Week ${lastWeek.week_num} final</p>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">WAU (15min+ Meetings)</div>
        <div class="kpi-value">${fmt(currentWeek.wau_cumulative)}</div>
        ${progressBar(currentWeek.wau_cumulative, lastWeek.wau, 'var(--accent)')}
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Quilliam Unique Users</div>
        <div class="kpi-value">${fmt(currentWeek.quilliam_cumulative)}</div>
        ${progressBar(currentWeek.quilliam_cumulative, lastWeek.quilliam_unique, 'var(--accent2)')}
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Signups</div>
        <div class="kpi-value">${fmt(currentWeek.signups_cumulative)}</div>
        ${progressBar(currentWeek.signups_cumulative, lastWeek.signups, 'var(--green)')}
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Downloads</div>
        <div class="kpi-value">${fmt(currentWeek.downloads_cumulative)}</div>
        ${progressBar(currentWeek.downloads_cumulative, lastWeek.downloads, 'var(--orange)')}
      </div>
    </div>

    <!-- Last completed week summary -->
    <div class="chart-card" style="margin-bottom:28px">
      <div class="chart-title">Week ${lastWeek.week_num} Final (${new Date(lastWeek.week_start+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${new Date(new Date(lastWeek.week_start+'T00:00:00').getTime()+6*86400000).toLocaleDateString('en-US',{month:'short',day:'numeric'})})</div>
      <div class="chart-subtitle">Completed week benchmark</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;padding-top:12px">
        <div><div class="kpi-label">WAU</div><div style="font-size:20px;font-weight:700">${fmt(lastWeek.wau)}</div></div>
        <div><div class="kpi-label">Quilliam</div><div style="font-size:20px;font-weight:700">${fmt(lastWeek.quilliam_unique)}</div></div>
        <div><div class="kpi-label">Downloads</div><div style="font-size:20px;font-weight:700">${fmt(lastWeek.downloads)}</div><div style="font-size:11px;color:var(--muted)">${fmt(lastWeek.downloads_organic)} organic · ${fmt(lastWeek.downloads_paid)} paid</div></div>
        <div><div class="kpi-label">Signups</div><div style="font-size:20px;font-weight:700">${fmt(lastWeek.signups)}</div></div>
      </div>
    </div>

    <!-- WAU Trend -->
    <div class="charts-grid">
      <div class="chart-card full">
        <div class="chart-title">WAU Trend — 15min+ Meetings (Weekly)</div>
        <div class="chart-subtitle">Unique users per week since Aug 2025</div>
        <div class="chart-container"><canvas id="wauTrendChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Quilliam Agent — Weekly Unique Users</div>
        <div class="chart-subtitle">Deduplicated unique users per week</div>
        <div class="chart-container"><canvas id="quilliamWeeklyChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">WAU Composition</div>
        <div class="chart-subtitle">Identified vs Anonymous (last 12 weeks)</div>
        <div class="chart-container"><canvas id="compositionChart"></canvas></div>
      </div>
    </div>`;

  return html;
}

function renderCharts() {
  const chartDefaults = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#9ca3af', font: { size: 11 } } } },
    scales: {
      x: { ticks: { color: '#6b7280', font: { size: 10 } }, grid: { color: '#1e2130' } },
      y: { ticks: { color: '#6b7280', font: { size: 10 } }, grid: { color: '#1e2130' } }
    }
  };

  if (currentView === 'daily') {
    // Daily Quilliam trend (last 14 days)
    const last14 = DAILY_DATA.filter(d => d.quilliam != null).slice(-14);
    const canvas = document.getElementById('dailyQuilliamChart');
    if (canvas) {
      chartInstances.dailyQuilliam = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: last14.map(d => {
            const dt = new Date(d.date+'T00:00:00');
            return d.day + ' ' + dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
          }),
          datasets: [{
            label: 'Quilliam DAU',
            data: last14.map(d => d.quilliam),
            backgroundColor: last14.map(d =>
              d.week === WEEKLY_DATA[WEEKLY_DATA.length-1].week_num ? 'rgba(34,211,238,0.9)' : 'rgba(34,211,238,0.4)'
            ),
            borderRadius: 3, borderSkipped: false
          }]
        },
        options: { ...chartDefaults, plugins: { ...chartDefaults.plugins, legend: { display: false } } }
      });
    }
  } else {
    // WAU Trend
    const wauCanvas = document.getElementById('wauTrendChart');
    if (wauCanvas) {
      chartInstances.wauTrend = new Chart(wauCanvas, {
        type: 'line',
        data: {
          labels: EMBEDDED_WAU.map(d => {
            const dt = new Date(d.Week_Start);
            return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
          }),
          datasets: [{
            label: 'Meeting WAU',
            data: EMBEDDED_WAU.map(d => d.Meeting_WAU),
            borderColor: '#6366f1', backgroundColor: 'rgba(99,102,241,0.1)',
            fill: true, tension: 0.3, pointRadius: 2, pointHoverRadius: 5, borderWidth: 2.5
          }]
        },
        options: {
          ...chartDefaults,
          plugins: { ...chartDefaults.plugins, tooltip: { callbacks: { label: ctx => `WAU: ${ctx.parsed.y.toLocaleString()}` } } }
        }
      });
    }

    // Quilliam weekly — aggregate daily data into weeks
    const quilliamByWeek = {};
    EMBEDDED_QUILLIAM.forEach(d => {
      const date = new Date(d.Date+'T00:00:00');
      const day = date.getDay();
      const diff = date.getDate() - day;
      const sun = new Date(date); sun.setDate(diff);
      const key = sun.toISOString().split('T')[0];
      if (!quilliamByWeek[key]) quilliamByWeek[key] = { total:0, peak:0 };
      quilliamByWeek[key].total += d.Unique_Users;
      quilliamByWeek[key].peak = Math.max(quilliamByWeek[key].peak, d.Unique_Users);
    });
    // Replace with deduplicated weekly uniques where we have them
    const w11 = WEEKLY_DATA.find(w => w.week_num === 11);
    if (w11) quilliamByWeek["2026-03-08"] = { total: w11.quilliam_unique, peak: 147, deduped: true };

    const qWeeks = Object.keys(quilliamByWeek).sort();
    const qCanvas = document.getElementById('quilliamWeeklyChart');
    if (qCanvas) {
      chartInstances.quilliamWeekly = new Chart(qCanvas, {
        type: 'bar',
        data: {
          labels: qWeeks.map(k => new Date(k).toLocaleDateString('en-US',{month:'short',day:'numeric'})),
          datasets: [{
            label: 'Weekly Users',
            data: qWeeks.map(k => quilliamByWeek[k].total),
            backgroundColor: qWeeks.map(k =>
              k >= '2026-03-08' ? 'rgba(34,211,238,0.8)' : 'rgba(34,211,238,0.35)'
            ),
            borderRadius: 3, borderSkipped: false
          }]
        },
        options: { ...chartDefaults, plugins: { ...chartDefaults.plugins, legend: { display: false } } }
      });
    }

    // Composition chart
    const last12 = EMBEDDED_WAU.slice(-12);
    const compCanvas = document.getElementById('compositionChart');
    if (compCanvas) {
      chartInstances.composition = new Chart(compCanvas, {
        type: 'bar',
        data: {
          labels: last12.map(d => new Date(d.Week_Start).toLocaleDateString('en-US',{month:'short',day:'numeric'})),
          datasets: [
            { label:'Identified', data:last12.map(d=>d.Identified), backgroundColor:'rgba(99,102,241,0.7)', borderRadius:3 },
            { label:'Anonymous', data:last12.map(d=>d.Anonymous), backgroundColor:'rgba(99,102,241,0.25)', borderRadius:3 }
          ]
        },
        options: {
          ...chartDefaults,
          scales: {
            ...chartDefaults.scales,
            x:{...chartDefaults.scales.x, stacked:true},
            y:{...chartDefaults.scales.y, stacked:true}
          }
        }
      });
    }
  }
}

function renderFunnelBars(pv, dl, su, prevPv, prevDl, prevSu, compLabel) {
  // Funnel: page views → downloads → signups, each bar proportional to the top
  const topVal = pv || dl || su || 1; // largest stage available for scaling
  const pvPct = pv != null ? 100 : null;
  const dlPct = pv != null && pv > 0 ? (dl / pv * 100).toFixed(1) : (dl > 0 ? 100 : 0);
  const suPct = pv != null && pv > 0 ? (su / pv * 100).toFixed(1) : (dl > 0 ? (su / dl * 100).toFixed(1) : 0);

  // Conversion rates
  const pvToDl = pv != null && pv > 0 ? ((dl / pv) * 100).toFixed(1) + '%' : '—';
  const dlToSu = dl > 0 ? ((su / dl) * 100).toFixed(1) + '%' : '—';
  const prevPvToDl = prevPv != null && prevPv > 0 ? ((prevDl / prevPv) * 100).toFixed(1) + '%' : '—';
  const prevDlToSu = prevDl > 0 ? ((prevSu / prevDl) * 100).toFixed(1) + '%' : '—';

  let html = '';

  // Page Views bar
  if (pv != null) {
    html += `
      <div class="funnel-bar-container">
        <div class="funnel-label">Page Views</div>
        <div class="funnel-bar-bg"><div class="funnel-bar-fill" style="width:100%;background:var(--accent)">${fmt(pv)}</div></div>
        <div class="funnel-rate">${compLabel}: ${prevPv != null ? fmt(prevPv) : '—'}</div>
      </div>`;
  } else {
    html += `
      <div class="funnel-bar-container">
        <div class="funnel-label">Page Views</div>
        <div class="funnel-bar-bg"><div class="funnel-bar-fill" style="width:0%;background:var(--accent)"><span style="color:var(--muted);padding-left:8px">Awaiting data</span></div></div>
        <div class="funnel-rate">—</div>
      </div>`;
  }

  // Downloads bar — scaled relative to page views if available, otherwise 100%
  const dlBarWidth = pv != null && pv > 0 ? dlPct : 100;
  html += `
    <div class="funnel-bar-container">
      <div class="funnel-label">Downloads</div>
      <div class="funnel-bar-bg"><div class="funnel-bar-fill" style="width:${dlBarWidth}%;background:#818cf8">${fmt(dl)}</div></div>
      <div class="funnel-rate">${pvToDl !== '—' ? pvToDl : ''} ${compLabel}: ${fmt(prevDl)}</div>
    </div>`;

  // Signups bar — scaled relative to page views if available, otherwise relative to downloads
  const suBarWidth = pv != null && pv > 0 ? suPct : (dl > 0 ? (su / dl * 100).toFixed(1) : 0);
  html += `
    <div class="funnel-bar-container">
      <div class="funnel-label">Sign Ups</div>
      <div class="funnel-bar-bg"><div class="funnel-bar-fill" style="width:${suBarWidth}%;background:var(--accent2)">${fmt(su)}</div></div>
      <div class="funnel-rate">${dlToSu} conv. ${compLabel}: ${fmt(prevSu)}</div>
    </div>`;

  return html;
}

function renderFunnel() {
  if (currentView === 'daily') {
    const today = getToday();
    const todayData = findDailyData(today);
    const lastWeekData = findSameDayLastWeek(today);
    const dayName = getDayOfWeek(today);

    const pv = todayData ? todayData.page_views : null;
    const dl = todayData ? todayData.downloads : 0;
    const su = todayData ? todayData.signups : 0;
    const prevPv = lastWeekData ? lastWeekData.page_views : null;
    const prevDl = lastWeekData ? lastWeekData.downloads : 0;
    const prevSu = lastWeekData ? lastWeekData.signups : 0;

    return `
      <div class="chart-card" style="margin-bottom:28px">
        <div class="chart-title">Daily Acquisition Funnel</div>
        <div class="chart-subtitle">Today (${dayName}) vs Last ${dayName} | Mixpanel</div>
        <div style="padding-top:16px">
          ${renderFunnelBars(pv, dl, su, prevPv, prevDl, prevSu, 'Last ' + dayName)}
        </div>
      </div>
      <div style="text-align:center;padding:24px;color:var(--muted);font-size:11px;">
        Data source: Mixpanel
      </div>`;

  } else {
    const currentWeek = WEEKLY_DATA.find(w => !w.complete);
    const lastWeek = WEEKLY_DATA.find(w => w.complete && w.week_num === (currentWeek ? currentWeek.week_num - 1 : null));
    if (!currentWeek || !lastWeek) return '';

    const pv = currentWeek.page_views_cumulative || null;
    const dl = currentWeek.downloads_cumulative || 0;
    const su = currentWeek.signups_cumulative || 0;
    const prevPv = lastWeek.page_views || null;
    const prevDl = lastWeek.downloads || 0;
    const prevSu = lastWeek.signups || 0;

    return `
      <div class="chart-card" style="margin-bottom:28px">
        <div class="chart-title">Weekly Acquisition Funnel</div>
        <div class="chart-subtitle">Week ${currentWeek.week_num} so far (${currentWeek.days_reported} days) vs Week ${lastWeek.week_num} final | Mixpanel</div>
        <div style="padding-top:16px">
          ${renderFunnelBars(pv, dl, su, prevPv, prevDl, prevSu, 'Last wk')}
        </div>
      </div>
      <div style="text-align:center;padding:24px;color:var(--muted);font-size:11px;">
        Data source: Mixpanel
      </div>`;
  }
}

function render() {
  destroyCharts();
  const viewHtml = currentView === 'daily' ? renderDaily() : renderWeekly();
  document.getElementById('dashboard').innerHTML = viewHtml + renderFunnel();
  document.getElementById('lastUpdated').textContent = 'Data as of: Mar 16, 2026';
  renderCharts();
}

render();
</script>
</body>
</html>
